<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">電影影像參考與查證流程</title><desc id="desc">自製圖：畫面參考、技巧術語、提示詞、人工驗收四步驟。</desc><rect width="1200" height="360" fill="#111827"/><text x="60" y="85" fill="#f9fafb" font-family="sans-serif" font-size="35" font-weight="bold">電影影像參考：從靈感到驗收</text><g font-family="sans-serif" font-size="25" text-anchor="middle"><rect x="45" y="135" width="245" height="110" rx="16" fill="#1d4ed8"/><text x="167" y="200" fill="white">畫面參考</text><rect x="335" y="135" width="245" height="110" rx="16" fill="#0f766e"/><text x="457" y="200" fill="white">技巧術語</text><rect x="625" y="135" width="245" height="110" rx="16" fill="#7c3aed"/><text x="747" y="200" fill="white">提示詞</text><rect x="915" y="135" width="245" height="110" rx="16" fill="#b45309"/><text x="1037" y="200" fill="white">人工驗收</text><g fill="#d1d5db"><text x="312" y="201">→</text><text x="602" y="201">→</text><text x="892" y="201">→</text></g></g><text x="60" y="310" fill="#d1d5db" font-family="sans-serif" font-size="20">自製示意圖｜查證功能與版權，不保證生成效果</text></svg>