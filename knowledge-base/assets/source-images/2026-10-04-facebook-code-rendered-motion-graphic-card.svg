<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">程式逐格渲染 AI Motion Graphic 工作流</title><desc id="desc">從分鏡、時間函數、抽樣檢查到 FFmpeg 輸出的工程化影片流程</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#24124a"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#72e9df"/><stop offset="1" stop-color="#a98bff"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1420" cy="120" r="250" fill="#6938be" opacity=".22"/><circle cx="100" cy="820" r="280" fill="#007e88" opacity=".18"/>
<text x="110" y="130" fill="#d9fff9" font-family="Arial, sans-serif" font-size="34" letter-spacing="5">AI LEARNING RADAR · FACEBOOK REEL</text>
<text x="110" y="230" fill="#fff" font-family="Arial, sans-serif" font-size="76" font-weight="700">程式逐格渲染</text><text x="110" y="315" fill="url(#a)" font-family="Arial, sans-serif" font-size="76" font-weight="700">AI Motion Graphic</text>
<text x="110" y="380" fill="#bdcbe2" font-family="Arial, sans-serif" font-size="32">不是一鍵生成，而是可重現、可審查的影片製作流程</text>
<g font-family="Arial, sans-serif"><g fill="#102b45" stroke="#66ded7" stroke-width="2"><rect x="110" y="510" width="245" height="145" rx="22"/><rect x="405" y="510" width="245" height="145" rx="22"/><rect x="700" y="510" width="245" height="145" rx="22"/><rect x="995" y="510" width="245" height="145" rx="22"/><rect x="1290" y="510" width="200" height="145" rx="22"/></g><g fill="#fff" font-size="30" font-weight="700"><text x="158" y="570">1. 分鏡</text><text x="448" y="570">2. 時間函數</text><text x="750" y="570">3. Playwright</text><text x="1040" y="570">4. 抽樣檢查</text><text x="1336" y="570">5. FFmpeg</text></g><g fill="#b8d4e8" font-size="21"><text x="145" y="615">先審方向</text><text x="430" y="615">每格由 t 決定</text><text x="745" y="615">逐格擷取</text><text x="1033" y="615">修正再全片</text><text x="1340" y="615">輸出 MP4</text></g></g>
<path d="M360 582h38m252 0h38m252 0h38m252 0h38" stroke="#a98bff" stroke-width="8" stroke-linecap="round"/><text x="110" y="780" fill="#d9fff9" font-family="Arial, sans-serif" font-size="30">HTML Canvas · Claude Code · Node.js · FFmpeg · 旁白與字幕時間軸</text><text x="110" y="840" fill="#91a9c7" font-family="Arial, sans-serif" font-size="23">社群示範整理；模型名稱與成品效果請以官方文件與實測重新確認</text>
